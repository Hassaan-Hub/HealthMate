<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthMate Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="dashboard">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- ================= Sidebar ================= -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    ❤️ HealthMate
                </div>
                <button class="sidebar-close" id="sidebarCloseBtn" aria-label="Close sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <nav>
                <a class="active">🏠 Dashboard</a>
                <a>👨‍👩‍👧 Family Members</a>
                <a>📄 Medical Reports</a>
                <a>🤖 AI HealthMate</a>
                <a>📅 Appointments</a>
                <a>⚙️ Settings</a>
                <a id="logoutBtn">🚪 Logout</a>
            </nav>
        </aside>
        <!-- ================= Main ================= -->
        <main>
            <!-- Header -->
            <header>
                <div class="header-left">
                    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div>
                        <h1>
                            Good Morning 👋
                        </h1>
                        <p>
                            Welcome back,
                            <span id="username">
                                Loading...
                            </span>
                        </p>
                    </div>
                </div>
                <div class="header-right">
                    <input type="text" placeholder="Search">
                    <button>
                        🔔
                    </button>
                </div>
            </header>
            <!-- Stats -->
            <section class="cards">
                <div class="card">
                    <h2 id="memberCount">
                        0
                    </h2>
                    <p>
                        Family Members
                    </p>
                </div>
                <div class="card">
                    <h2>
                        0
                    </h2>
                    <p>
                        Medical Reports
                    </p>
                </div>
                <div class="card">
                    <h2>
                        0
                    </h2>
                    <p>
                        Appointments
                    </p>
                </div>
                <div class="card">
                    <h2>
                        100%
                    </h2>
                    <p>
                        Health Score
                    </p>
                </div>
            </section>
            <!-- Add Member -->
            <section class="member-box">
                <h2>
                    Add Family Member
                </h2>
                <form id="memberForm">
                    <input id="name" placeholder="Full Name" required>
                    <input id="age" type="number" placeholder="Age" required>
                    <input id="relation" placeholder="Relation" required>
                    <button>
                        + Save Member
                    </button>
                </form>
            </section>
            <!-- Member List -->
            <section>
                <h2>
                    Family Members
                </h2>
                <div id="members" class="member-grid">
                </div>
            </section>
        </main>
    </div>
</body>
<script type="module" src="dashboard.js" defer></script>

</html>
